name: cactus_native
description: Bundles the prebuilt Cactus engine library (libcactus_engine) into the app for iOS and Android.
version: 0.0.1
publish_to: 'none'

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
